name: Release

# Pushing a tag like v1.0.0 builds the zip and publishes a GitHub release with it attached.
# VERSION is stamped and committed by tools/release.sh before the tag is created; CI only checks it matches.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check VERSION matches the tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = (Get-Content VERSION -Raw).Trim()
          if ($tag -ne "v$ver") { throw "VERSION is '$ver' but the tag is '$tag'. Use tools/release.sh." }

      - name: Build zip
        shell: pwsh
        run: |
          # images/ holds README screenshots and sources; only the Ko-fi button is used at runtime
          New-Item -ItemType Directory -Path stage/images | Out-Null
          Copy-Item images/btn-kofi.png stage/images/
          Copy-Item overlay.ahk, VERSION, README.md, lib, icons -Destination stage -Recurse
          Compress-Archive -Path stage/* -DestinationPath "poe-travel-overlay-${{ github.ref_name }}.zip"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" "poe-travel-overlay-${{ github.ref_name }}.zip" --title "${{ github.ref_name }}" --generate-notes
